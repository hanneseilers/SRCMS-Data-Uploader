# SRCMS Data Uploader – remote app configuration
#
# Each entry defines a named "app" (category) on the Android device and the
# remote path where files should be uploaded to.
#
# Fields:
#   name  – Human-readable label shown in the selection menu
#   path  – Absolute path on the Android device (used as the adb push destination)

apps:
  - name: "Audio-Quiz"
    path: "/sdcard/Android/data/de.fhkiel.socialrobotcms/files/repo/AudioQuiz"

  - name: "Buchstaben-Quiz (Character)"
    path: "/sdcard/Android/data/de.fhkiel.socialrobotcms/files/repo/Character"

  - name: "Hinweis-Quiz (Hints)"
    path: "/sdcard/Android/data/de.fhkiel.socialrobotcms/files/repo/Hints"

  - name: "Jukebox"
    path: "/sdcard/Android/data/de.fhkiel.socialrobotcms/files/repo/Jukebox"

  - name: "Stichwörter-Quiz (Keywords)"
    path: "/sdcard/Android/data/de.fhkiel.socialrobotcms/files/repo/Keywords"

  - name: "Meditation"
    path: "/sdcard/Android/data/de.fhkiel.socialrobotcms/files/repo/Mediation"

  - name: "Sprichwörter-Quiz (Proverbs)"
    path: "/sdcard/Android/data/de.fhkiel.socialrobotcms/files/repo/Proverbs"

  - name: "Quiz"
    path: "/sdcard/Android/data/de.fhkiel.socialrobotcms/files/repo/Quiz"

